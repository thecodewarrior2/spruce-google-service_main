<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1010" viewBox="0 0 980 1010" role="img" aria-label="Decision map: an email arrives, phishing-training mail is let through, the rule checks and the AI score it, then in order: a confirmed Trusted sender is left alone; a move rule moves it as phishing; a spam rule moves it as spam; a suspicious sign keeps it in the Inbox for Review; confirmed marketing goes to Review's Promotional list; anything else is safe and nothing is done."><style>
.bg{fill:#ffffff}
.box{fill:#ffffff;stroke:#c9d3d0;stroke-width:1.5}
.spinebox{fill:#ffffff;stroke:#2f6b5f;stroke-width:2}
.checks{fill:#e8ecea;stroke:#c9d3d0;stroke-width:1.5}
.o-phish{fill:#fde9dc;stroke:#c2410c;stroke-width:2}
.o-spam{fill:#fbefcf;stroke:#a16207;stroke-width:2}
.o-safe{fill:#e1ecfb;stroke:#1d5fb8;stroke-width:2}
.o-review{fill:#ece4fb;stroke:#6d28d9;stroke-width:2}
.o-neutral{fill:#e8ecea;stroke:#c9d3d0;stroke-width:2}
text{font-family:"Public Sans","Segoe UI",Arial,sans-serif}
.t{fill:#17211f;font-size:13px}
.tb{fill:#17211f;font-size:14px;font-weight:600}
.tt{fill:#17211f;font-size:15px;font-weight:700}
.tm{fill:#55635f;font-size:12px}
.tphish{fill:#c2410c;font-size:12px;font-weight:700;letter-spacing:.06em}
.tspam{fill:#a16207;font-size:12px;font-weight:700;letter-spacing:.06em}
.tsafe{fill:#1d5fb8;font-size:12px;font-weight:700;letter-spacing:.06em}
.treview{fill:#6d28d9;font-size:12px;font-weight:700;letter-spacing:.06em}
.tneutral{fill:#55635f;font-size:12px;font-weight:700;letter-spacing:.06em}
.yes{fill:#2f6b5f;font-size:12px;font-weight:700}
.wire{stroke:#2f6b5f;stroke-width:2;fill:none}
.wire2{stroke:#55635f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head{fill:#2f6b5f}
.bar-g{fill:#1d5fb8}.bar-s{fill:#a16207}.bar-p{fill:#c2410c}
</style><rect class="bg" x="0" y="0" width="980" height="1010"/>
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
          </defs>
          <!-- spine -->
          <rect class="spinebox" x="110" y="16" width="380" height="54" rx="10"/>
          <text class="tt" x="300" y="40" text-anchor="middle">An email reaches a watched Inbox</text>
          <text class="tm" x="300" y="58" text-anchor="middle">Gmail tells the service at once; it reads the email</text>
          <line class="wire" x1="300" y1="70" x2="300" y2="100" marker-end="url(#ah)"/>

          <rect class="box" x="110" y="102" width="380" height="54" rx="10"/>
          <text class="tb" x="300" y="126" text-anchor="middle">A phishing-training email you set up?</text>
          <text class="tm" x="300" y="144" text-anchor="middle">Settings → Phishing training (its header or sender)</text>
          <line class="wire" x1="490" y1="129" x2="636" y2="129" marker-end="url(#ah)"/><text class="yes" x="560" y="121" text-anchor="middle">yes</text>
          <rect class="o-neutral" x="640" y="102" width="320" height="54" rx="10"/>
          <text class="tneutral" x="656" y="122">LET THROUGH</text>
          <text class="t" x="656" y="143">Not checked, only counted</text>
          <line class="wire" x1="300" y1="156" x2="300" y2="184" marker-end="url(#ah)"/><text class="yes" x="312" y="175">no</text>

          <!-- the two readers -->
          <rect class="checks" x="30" y="186" width="540" height="190" rx="12"/>
          <text class="tt" x="300" y="210" text-anchor="middle">Both readers score it</text>
          <rect class="box" x="48" y="222" width="250" height="138" rx="8"/>
          <text class="tb" x="62" y="244">Rule checks → points</text>
          <text class="t" x="62" y="266">Sender: DMARC, SPF, DKIM,</text>
          <text class="t" x="62" y="283">forged headers, first email</text>
          <text class="t" x="62" y="303">Imitation: brands, look-alikes,</text>
          <text class="t" x="62" y="320">staff names from your directory</text>
          <text class="t" x="62" y="340">Links, attachments, QR codes,</text>
          <text class="t" x="62" y="356">threat lists, site age</text>
          <rect class="box" x="310" y="222" width="244" height="138" rx="8"/>
          <text class="tb" x="324" y="244">AI model → two scores</text>
          <text class="t" x="324" y="266">Reads the sender facts, the</text>
          <text class="t" x="324" y="283">links and the text, like a person</text>
          <text class="t" x="324" y="306">Phishing: 0–100%</text>
          <text class="t" x="324" y="323">Spam (bulk marketing): 0–100%</text>
          <text class="tm" x="324" y="346">Runs inside the service; nothing sent out</text>
          <line class="wire" x1="300" y1="376" x2="300" y2="404" marker-end="url(#ah)"/>

          <!-- question rows -->
          <rect class="box" x="110" y="406" width="380" height="58" rx="10"/>
          <text class="tb" x="300" y="430" text-anchor="middle">On Trusted senders, and Gmail confirms it?</text>
          <text class="tm" x="300" y="449" text-anchor="middle">DMARC passes; the domain not suspended by the 30-day check</text>
          <line class="wire" x1="490" y1="435" x2="636" y2="435" marker-end="url(#ah)"/><text class="yes" x="560" y="427" text-anchor="middle">yes</text>
          <rect class="o-safe" x="640" y="406" width="320" height="58" rx="10"/>
          <text class="tsafe" x="656" y="427">SAFE</text>
          <text class="t" x="656" y="448">Left alone; a forged copy fails DMARC</text>
          <line class="wire" x1="300" y1="464" x2="300" y2="492" marker-end="url(#ah)"/><text class="yes" x="312" y="483">no</text>

          <rect class="box" x="110" y="494" width="380" height="76" rx="10"/>
          <text class="tb" x="300" y="517" text-anchor="middle">Does a move rule apply?</text>
          <text class="t" x="300" y="537" text-anchor="middle">Rule points 5 or more · AI phishing at the move line</text>
          <text class="t" x="300" y="555" text-anchor="middle">(outside senders only) · a Skip review sign you chose</text>
          <line class="wire" x1="490" y1="532" x2="636" y2="532" marker-end="url(#ah)"/><text class="yes" x="560" y="524" text-anchor="middle">yes</text>
          <rect class="o-phish" x="640" y="494" width="320" height="76" rx="10"/>
          <text class="tphish" x="656" y="516">PHISHING</text>
          <text class="t" x="656" y="537">Moved to the Spam folder</text>
          <text class="tm" x="656" y="556">Monitor mode: recorded as "would move"</text>
          <line class="wire" x1="300" y1="570" x2="300" y2="598" marker-end="url(#ah)"/><text class="yes" x="312" y="589">no</text>

          <rect class="box" x="110" y="600" width="380" height="76" rx="10"/>
          <text class="tb" x="300" y="623" text-anchor="middle">Is it spam?</text>
          <text class="t" x="300" y="643" text-anchor="middle">On Spam senders · padded list mail · AI spam at the</text>
          <text class="t" x="300" y="661" text-anchor="middle">move line from a sender Gmail couldn't confirm</text>
          <line class="wire" x1="490" y1="638" x2="636" y2="638" marker-end="url(#ah)"/><text class="yes" x="560" y="630" text-anchor="middle">yes</text>
          <rect class="o-spam" x="640" y="600" width="320" height="76" rx="10"/>
          <text class="tspam" x="656" y="622">SPAM</text>
          <text class="t" x="656" y="643">Moved to the Spam folder as spam</text>
          <text class="tm" x="656" y="662">Never mail from inside your organization</text>
          <line class="wire" x1="300" y1="676" x2="300" y2="704" marker-end="url(#ah)"/><text class="yes" x="312" y="695">no</text>

          <rect class="box" x="110" y="706" width="380" height="76" rx="10"/>
          <text class="tb" x="300" y="729" text-anchor="middle">Is anything suspicious?</text>
          <text class="t" x="300" y="749" text-anchor="middle">Rule points 3 or more · AI phishing at the</text>
          <text class="t" x="300" y="767" text-anchor="middle">suspicious line (but under the move line)</text>
          <line class="wire" x1="490" y1="744" x2="636" y2="744" marker-end="url(#ah)"/><text class="yes" x="560" y="736" text-anchor="middle">yes</text>
          <rect class="o-review" x="640" y="706" width="320" height="76" rx="10"/>
          <text class="treview" x="656" y="728">SUSPICIOUS</text>
          <text class="t" x="656" y="749">Stays in the Inbox; listed in Review</text>
          <text class="tm" x="656" y="768">Looked at again an hour and a day later</text>
          <line class="wire" x1="300" y1="782" x2="300" y2="810" marker-end="url(#ah)"/><text class="yes" x="312" y="801">no</text>

          <rect class="box" x="110" y="812" width="380" height="58" rx="10"/>
          <text class="tb" x="300" y="836" text-anchor="middle">Marketing from a sender Gmail confirmed?</text>
          <text class="tm" x="300" y="855" text-anchor="middle">Gmail's Promotions tab, or a signed one-click unsubscribe</text>
          <line class="wire" x1="490" y1="841" x2="636" y2="841" marker-end="url(#ah)"/><text class="yes" x="560" y="833" text-anchor="middle">yes</text>
          <rect class="o-review" x="640" y="812" width="320" height="58" rx="10"/>
          <text class="treview" x="656" y="833">PROMOTIONAL</text>
          <text class="t" x="656" y="854">Never moved; one answer per company</text>
          <line class="wire" x1="300" y1="870" x2="300" y2="898" marker-end="url(#ah)"/><text class="yes" x="312" y="889">no</text>

          <rect class="o-safe" x="110" y="900" width="380" height="58" rx="10"/>
          <text class="tsafe" x="126" y="921">SAFE</text>
          <text class="t" x="126" y="942">Nothing done; nothing recorded about it</text>

          <!-- feedback loop from the outcomes back to the readers -->
          <path class="wire2" d="M960,960 L960,990 L20,990 L20,280 L28,280" marker-end="url(#ah)"/>
          <text class="tm" x="490" y="984" text-anchor="middle">Answers in Review (Phishing, Spam, Mark safe) and later re-checks feed back into the next decisions</text>
        </svg>
