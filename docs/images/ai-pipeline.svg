<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="The AI pipeline: the email's facts and text are written as one passage with addresses and numbers hidden, cut to 256 word pieces, read by 12 layers in which every word piece weighs every other, and turned into two scores, phishing and spam, which become three probabilities: genuine, spam and phishing. The service then compares the phishing probability with the suspicious and move lines."><style>
.bg{fill:#ffffff}
.box{fill:#ffffff;stroke:#c9d3d0;stroke-width:1.5}
.spinebox{fill:#ffffff;stroke:#2f6b5f;stroke-width:2}
.checks{fill:#e8ecea;stroke:#c9d3d0;stroke-width:1.5}
.o-phish{fill:#fde9dc;stroke:#c2410c;stroke-width:2}
.o-spam{fill:#fbefcf;stroke:#a16207;stroke-width:2}
.o-safe{fill:#e1ecfb;stroke:#1d5fb8;stroke-width:2}
.o-review{fill:#ece4fb;stroke:#6d28d9;stroke-width:2}
.o-neutral{fill:#e8ecea;stroke:#c9d3d0;stroke-width:2}
text{font-family:"Public Sans","Segoe UI",Arial,sans-serif}
.t{fill:#17211f;font-size:13px}
.tb{fill:#17211f;font-size:14px;font-weight:600}
.tt{fill:#17211f;font-size:15px;font-weight:700}
.tm{fill:#55635f;font-size:12px}
.tphish{fill:#c2410c;font-size:12px;font-weight:700;letter-spacing:.06em}
.tspam{fill:#a16207;font-size:12px;font-weight:700;letter-spacing:.06em}
.tsafe{fill:#1d5fb8;font-size:12px;font-weight:700;letter-spacing:.06em}
.treview{fill:#6d28d9;font-size:12px;font-weight:700;letter-spacing:.06em}
.tneutral{fill:#55635f;font-size:12px;font-weight:700;letter-spacing:.06em}
.yes{fill:#2f6b5f;font-size:12px;font-weight:700}
.wire{stroke:#2f6b5f;stroke-width:2;fill:none}
.wire2{stroke:#55635f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head{fill:#2f6b5f}
.bar-g{fill:#1d5fb8}.bar-s{fill:#a16207}.bar-p{fill:#c2410c}
</style><rect class="bg" x="0" y="0" width="1000" height="300"/>
          <defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
          <rect class="box" x="10" y="40" width="150" height="150" rx="10"/>
          <text class="tb" x="85" y="66" text-anchor="middle">1 · What it's given</text>
          <text class="t" x="85" y="92" text-anchor="middle">A line about the</text>
          <text class="t" x="85" y="109" text-anchor="middle">sender and links</text>
          <text class="t" x="85" y="133" text-anchor="middle">+ the email's text</text>
          <text class="tm" x="85" y="160" text-anchor="middle">addresses → domains,</text>
          <text class="tm" x="85" y="176" text-anchor="middle">numbers hidden</text>
          <line class="wire" x1="160" y1="115" x2="196" y2="115" marker-end="url(#ah2)"/>
          <rect class="box" x="200" y="40" width="150" height="150" rx="10"/>
          <text class="tb" x="275" y="66" text-anchor="middle">2 · Word pieces</text>
          <text class="t" x="275" y="92" text-anchor="middle">Split into pieces</text>
          <text class="t" x="275" y="109" text-anchor="middle">("verif", "##y")</text>
          <text class="t" x="275" y="133" text-anchor="middle">At most 256:</text>
          <text class="tm" x="275" y="160" text-anchor="middle">a long email keeps its</text>
          <text class="tm" x="275" y="176" text-anchor="middle">first 192 and last 62</text>
          <line class="wire" x1="350" y1="115" x2="386" y2="115" marker-end="url(#ah2)"/>
          <rect class="spinebox" x="390" y="40" width="200" height="150" rx="10"/>
          <text class="tb" x="490" y="66" text-anchor="middle">3 · 12 reading layers</text>
          <text class="t" x="490" y="92" text-anchor="middle">Each piece weighs every</text>
          <text class="t" x="490" y="109" text-anchor="middle">other: "verify" means more</text>
          <text class="t" x="490" y="126" text-anchor="middle">next to a link to a</text>
          <text class="t" x="490" y="143" text-anchor="middle">look-alike domain</text>
          <text class="tm" x="490" y="170" text-anchor="middle">13.5 million learned weights</text>
          <line class="wire" x1="590" y1="115" x2="626" y2="115" marker-end="url(#ah2)"/>
          <rect class="box" x="630" y="40" width="150" height="150" rx="10"/>
          <text class="tb" x="705" y="66" text-anchor="middle">4 · Two answers</text>
          <text class="t" x="705" y="94" text-anchor="middle">Phishing or not?</text>
          <text class="t" x="705" y="121" text-anchor="middle">If not phishing:</text>
          <text class="t" x="705" y="138" text-anchor="middle">bulk marketing or</text>
          <text class="t" x="705" y="155" text-anchor="middle">genuine?</text>
          <line class="wire" x1="780" y1="115" x2="816" y2="115" marker-end="url(#ah2)"/>
          <rect class="box" x="820" y="40" width="170" height="150" rx="10"/>
          <text class="tb" x="905" y="66" text-anchor="middle">5 · Three shares</text>
          <rect class="bar-g" x="840" y="84" width="88" height="16" rx="3"/><rect class="bar-s" x="928" y="84" width="18" height="16"/><rect class="bar-p" x="946" y="84" width="24" height="16" rx="3"/>
          <text class="tm" x="840" y="118">genuine · spam · phishing</text>
          <text class="t" x="905" y="144" text-anchor="middle">They add up to 100%</text>
          <text class="tm" x="905" y="166" text-anchor="middle">(an example, not real data)</text>
          <!-- policy -->
          <path class="wire" d="M905,190 L905,232 L600,232" marker-end="url(#ah2)"/>
          <rect class="o-neutral" x="240" y="214" width="356" height="70" rx="10"/>
          <text class="tb" x="418" y="238" text-anchor="middle">The service compares the phishing share</text>
          <text class="t" x="418" y="259" text-anchor="middle">with the suspicious line (65%) and the move line (90%),</text>
          <text class="t" x="418" y="276" text-anchor="middle">set in Settings → Policy, together with the rule points</text>
        </svg>
