<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S.P.R.U.C.E Mail Protection Service</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#view">Skip to the page</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="36" height="36">
      <div><div class="brand-name">S.P.R.U.C.E</div><div class="brand-sub" id="orgLine">Google Workspace</div></div>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#/overview" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></a>
      <a href="#/review" data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H4z"/><path d="m4 16 4 4h8l4-4"/></svg><span>Review</span><span class="count" id="reviewCount" hidden></span></a>
      <a href="#/campaigns" data-tab="threats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg><span>Threats</span></a>
      <a href="#/messages" data-tab="mail"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Mail</span></a>
      <a href="#/status" data-tab="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Health</span></a>
      <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Settings</span></a>
    </nav>
    <div class="mode-card" id="modeCard" hidden></div>
    <div class="side-foot">
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-pressed="true" title="Follow the system's light or dark setting"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>System</span></button>
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Always light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Always dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Dark</span></button>
      </div>
      <a href="#/help" data-tab="help" class="help-link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg><span>Help</span></a>
      <div class="who" id="who"></div>
    </div>
  </aside>
  <div class="main-col">
    <header class="top">
      <button type="button" class="menu-btn" id="menuBtn" aria-controls="sidebar" aria-expanded="false" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="filters" role="group" aria-label="Period">
        <button type="button" class="range" data-days="7">Last 7 days</button>
        <button type="button" class="range" data-days="30">Last 30 days</button>
        <button type="button" class="range" data-days="90">Last 90 days</button>
      </div>
      <span class="live" id="live" hidden>
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveState" aria-live="off">Live</span>
        <button type="button" class="linkbtn" id="liveToggle" aria-pressed="true">Pause updates</button>
      </span>
      <div class="top-right">
        <span class="mode" id="modeBadge" hidden></span>
      </div>
    </header>
    <div class="brake-banner" id="brakeBanner" role="alert" hidden></div>
    <main id="view" tabindex="-1"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<nav class="tabbar" aria-label="Sections (phone)">
  <a href="#/overview" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></a>
  <a href="#/review" data-tab="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H4z"/><path d="m4 16 4 4h8l4-4"/></svg><span>Review</span><span class="count" id="reviewCountTab" hidden></span></a>
  <a href="#/campaigns" data-tab="threats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/></svg><span>Threats</span></a>
  <a href="#/status" data-tab="health"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Health</span></a>
  <button type="button" class="tab-more" id="moreBtn" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span>More</span></button>
</nav>
<div class="tooltip" id="tip" role="tooltip" hidden></div>
</body>
</html>
